name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  host:
    name: Host build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the build id
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S platform/posix -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  firmware:
    name: ESP-IDF firmware (esp32c6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Partition tables match their generator
        run: python3 platform/esp/tools/gen_partitions.py --check
      - name: Build the application
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c6
          path: platform/esp
      - name: Build the OTA updater
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c6
          path: platform/esp/updater
