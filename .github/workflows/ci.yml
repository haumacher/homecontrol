name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  host:
    name: Host build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the build id
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure
        run: cmake -S platform/posix -B build -G Ninja
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  firmware:
    name: ESP-IDF firmware (esp32c6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Partition tables match their generator
        run: python3 platform/esp/tools/gen_partitions.py --check
      - name: Build the application
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c6
          path: platform/esp
      - name: Build the OTA updater
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c6
          path: platform/esp/updater
      - name: The updater keeps a margin of 16 KB in its partition
        run: python3 platform/esp/tools/gen_partitions.py --check-updater platform/esp/updater/build/hc_updater.bin

  deb:
    name: Debian package (trixie amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The release workflow's build (doc/linux.md), one distribution and architecture: the package
      # builds with the distribution's hardened -O2 flags and its tests pass there.
      - name: Build in debian:trixie
        run: docker run --rm -v "$PWD":/src -w /src debian:trixie debian/ci-build.sh
      - name: Install it
        run: >
          docker run --rm -v "$PWD":/src -w /src debian:trixie sh -c
          'apt-get update -qq && apt-get install -y -qq ./dist/homecontrol_*_trixie_amd64.deb >/dev/null &&
          dpkg-query -W homecontrol && test -x /usr/bin/homecontrol && test -f /usr/share/homecontrol/www/lang/de.json &&
          homecontrol --version'
