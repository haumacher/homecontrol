# Copyright (c) 2026 Bernhard Haumacher
#
# A firmware release (doc/ota.md "Releases and the web flasher"): pushing the tag vX.Y.Z, where X.Y.Z
# is hc::kVersion, builds the host tests, the OTA updater and the application for esp32c6 from fresh
# build directories (4 MB table, the committed release key, no HC_EXTRA_CA), assembles the assets
# with scripts/release-assets.py, signs the update manifest with the release key, verifies it
# against platform/esp/release-key.pub, creates the GitHub release and deploys the Pages site.
#
# The release key is the secret HC_RELEASE_KEY of the environment `release`, which admits only tags
# v*; only the job `sign` uses it, written to a mode 600 temporary file and shredded after use.
#
# The Linux package (doc/linux.md, homecontrol #95): the job `deb` builds homecontrol_<version>_<codename>_
# <arch>.deb for Debian Bookworm and Trixie on amd64, arm64 (native runners, with the host tests) and
# armhf (emulated, without them) in clean Debian containers (debian/ci-build.sh); the packages are
# assets of the release, and pages.yml publishes them in the signed apt repository on the site
# (/apt, suites per distribution, components stable and beta like the update channels).
#
# Run by hand (workflow_dispatch) it is a dry run of the current branch: everything up to the
# signature, but signed with a key generated in the job (the environment refuses a branch) and
# verified against that key; no release, no site. The assets, the packages, the site preview and an
# apt repository preview (signed with a key of the run) are the run's artifacts.
#
# The site: a release created with GITHUB_TOKEN starts no other workflow, so the job `pages` calls
# pages.yml as a reusable workflow in this run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the build id

      - name: Version and tag
        id: version
        run: |
          VERSION=$(sed -n 's/.*constexpr const char\* kVersion = "\([^"]*\)".*/\1/p' core/include/hc/version.h)
          echo "hc::kVersion is $VERSION"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::hc::kVersion $VERSION is not a release version X.Y.Z[-pre]"; exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::the tag $GITHUB_REF_NAME is not v$VERSION (hc::kVersion)"; exit 1
            fi
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "dry run of $GITHUB_REF_NAME: no release"
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Ninja
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build

      - name: Host tests
        run: |
          cmake -S platform/posix -B build-release-host -G Ninja
          cmake --build build-release-host
          ctest --test-dir build-release-host --output-on-failure

      - name: Partition tables match their generator
        run: python3 platform/esp/tools/gen_partitions.py --check

      # The same command lines as scripts/release.sh, in fresh build directories.
      - name: Build the OTA updater
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c6
          path: platform/esp/updater
          command: idf.py -B build-esp32c6-release -D IDF_TARGET=esp32c6 -D HC_FLASH_SIZE=4MB -D HC_EXTRA_CA= build

      - name: Build the application
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.6
          target: esp32c6
          path: platform/esp
          command: idf.py -B build-esp32c6-release -D IDF_TARGET=esp32c6 -D HC_FLASH_SIZE=4MB -D HC_EXTRA_CA= build

      - name: Assemble the assets
        run: |
          python3 scripts/release-assets.py assemble --app platform/esp/build-esp32c6-release \
            --updater platform/esp/updater/build-esp32c6-release --version "${{ steps.version.outputs.version }}" \
            --out "$RUNNER_TEMP/assets"

      - uses: actions/upload-artifact@v4
        with:
          name: release-unsigned
          path: ${{ runner.temp }}/assets
          retention-days: 7

  deb:
    needs: build
    name: deb ${{ matrix.suite }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
        arch: [amd64, arm64, armhf]
        include:
          - {arch: amd64, runner: ubuntu-24.04, platform: linux/amd64, check: ''}
          - {arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, check: ''}
          # The arm64 runners cannot execute 32-bit ARM code: armhf is emulated, its tests left out.
          - {arch: armhf, runner: ubuntu-24.04, platform: linux/arm/v7, check: --nocheck}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git describe for the build id

      - if: matrix.arch == 'armhf'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build in debian:${{ matrix.suite }}
        run: >
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD":/src -w /src debian:${{ matrix.suite }}
          debian/ci-build.sh ${{ matrix.check }}

      - name: The package is hc::kVersion
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          deb="dist/homecontrol_$(debian/hc-version to-debian "$VERSION")_${{ matrix.suite }}_${{ matrix.arch }}.deb"
          ls -l "$deb"
          dpkg-deb -f "$deb" Package Version Architecture Depends

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.suite }}-${{ matrix.arch }}
          path: dist/homecontrol_*_${{ matrix.suite }}_${{ matrix.arch }}.deb
          if-no-files-found: error
          retention-days: 30

  # The dry run's apt repository, as pages.yml builds it, signed with a key of this run.
  apt-preview:
    needs: [build, deb]
    if: needs.build.outputs.dry_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: ${{ runner.temp }}/debs

      - name: Build the repository
        run: |
          sudo apt-get install -y -qq apt-utils >/dev/null
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          gpg --batch --pinentry-mode loopback --passphrase '' --quick-gen-key "HomeControl dry run <dry-run@invalid>" ed25519 sign 1d
          debian/apt-repo.sh "$RUNNER_TEMP/apt" "$RUNNER_TEMP/debs"
          echo "dry run: signed with a key of this run, not the repository's key"

      - uses: actions/upload-artifact@v4
        with:
          name: apt-preview
          path: ${{ runner.temp }}/apt
          retention-days: 7

  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The environment holds the release key and admits only tags v*; a dry run uses none.
    environment: ${{ needs.build.outputs.dry_run != 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: release-unsigned
          path: ${{ runner.temp }}/assets

      - name: Ed25519 for Python
        run: python3 -c 'import cryptography' 2>/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography)

      - name: Sign with the release key
        if: needs.build.outputs.dry_run != 'true'
        env:
          HC_RELEASE_KEY: ${{ secrets.HC_RELEASE_KEY }}
        run: |
          KEY=$(mktemp)
          trap 'shred -u "$KEY"' EXIT
          chmod 600 "$KEY"
          printf '%s\n' "$HC_RELEASE_KEY" > "$KEY"
          python3 scripts/release-assets.py sign --key "$KEY" --out "$RUNNER_TEMP/assets" --site "$RUNNER_TEMP/site"

      - name: Sign with a key of this run (dry run)
        if: needs.build.outputs.dry_run == 'true'
        run: |
          DIR=$(mktemp -d)
          trap 'shred -u "$DIR/key"; rm -rf "$DIR"' EXIT
          python3 scripts/sign.py keygen "$DIR/key"
          python3 scripts/release-assets.py sign --key "$DIR/key" --public "$DIR/key.pub" --out "$RUNNER_TEMP/assets" \
            --site "$RUNNER_TEMP/site"
          echo "dry run: signed with a key of this run, not the release key"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.build.outputs.dry_run == 'true' && 'dry-run' || 'signed' }}
          path: ${{ runner.temp }}/assets
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: ${{ runner.temp }}/site
          retention-days: 7

  publish:
    needs: [build, sign, deb]
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-signed
          path: assets

      # The Linux packages: assets of the release, from which pages.yml builds the apt repository.
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: assets

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          PRE=
          case "$VERSION" in *-*) PRE=--prerelease ;; esac
          NOTES="HomeControl $VERSION for the ESP32-C6 (4 MB flash).

          - Install it on a new controller from the browser: https://haumacher.github.io/homecontrol/
          - Update an installed controller over the air: by itself, on the update channel Stable or Beta (Settings, Update channel)
          - Or upload \`homecontrol.bin\` on the controller's Settings page (Install firmware file).
          - On a Linux server (Debian Bookworm or Trixie, amd64, arm64, armhf): the package \`homecontrol\` from the apt repository https://haumacher.github.io/homecontrol/apt/, everything but Zigbee (doc/linux.md).

          Built and signed by this workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The update manifest is signed with the release key \`platform/esp/release-key.pub\`."
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag $PRE \
            --title "HomeControl $VERSION" --notes "$(printf '%s\n' "$NOTES" | sed 's/^          //')" --generate-notes \
            assets/*

  # The site is deployed by pages.yml on master: GitHub Pages serves the deployments of the
  # publishing branch, a deployment made under the tag ref is recorded but not served (#83).
  # workflow_dispatch is one of the events GITHUB_TOKEN may start.
  pages:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Deploy the site from master
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh workflow run pages.yml --repo "$REPO" --ref master
          # The run appears in the list after a moment.
          sleep 10
          id=$(gh run list --repo "$REPO" --workflow pages.yml --event workflow_dispatch --limit 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$id" --repo "$REPO" --exit-status
      - name: Check the stable channel
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          want="${VERSION#v}"
          case "$want" in *-*) echo "pre-release: the stable channel keeps its version"; exit 0 ;; esac
          for i in $(seq 1 40); do
            got=$(curl -fsS "https://haumacher.github.io/homecontrol/stable/manifest.json?n=$i$RANDOM" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)
            if [ "$got" = "$want" ]; then echo "stable announces $got"; exit 0; fi
            sleep 15
          done
          echo "::error::stable/manifest.json announces '$got', expected $want"
          exit 1
      - name: Check the apt repository
        env:
          VERSION: ${{ github.ref_name }}
          HAS_APT_KEY: ${{ secrets.APT_SIGNING_KEY != '' }}
        run: |
          # Without the signing key pages.yml publishes the site without /apt (its warning): nothing to check.
          if [ "$HAS_APT_KEY" != "true" ]; then echo "::warning::the secret APT_SIGNING_KEY is not set: no apt repository to check"; exit 0; fi
          want="$(printf '%s' "${VERSION#v}" | sed 's/-/~/g')" # debian/hc-version
          url=https://haumacher.github.io/homecontrol/apt/dists/trixie/beta/binary-amd64/Packages
          for i in $(seq 1 40); do
            if curl -fsS "$url?n=$i$RANDOM" | grep -qx "Version: $want"; then echo "the apt suite trixie/beta has $want"; exit 0; fi
            sleep 15
          done
          echo "::error::$url does not list $want (is the secret APT_SIGNING_KEY set? pages.yml says)"
          exit 1
