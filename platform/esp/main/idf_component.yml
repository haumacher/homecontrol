#
# Managed components (IDF component manager). The resolved versions are pinned in
# platform/esp/dependencies.lock.<target>, which are versioned.
dependencies:
  idf: ">=5.3"
  espressif/mdns: "^1.4.0"
  espressif/led_strip: "~3.0.0"
  # The E-Home connection (issue #41, doc/ehome.md): the outbound WebSocket over TLS.
  espressif/esp_websocket_client: "~1.8.0"
  # The LittleFS image with the web UI in the storage partition (doc/web.md).
  joltwallet/littlefs: "^1.14.0"
  # The Zigbee coordinator (issue #15, doc/zigbee.md): Espressif's Zigbee SDK v1.6 (the ZBOSS stack,
  # supports ESP-IDF v5.3), only on targets with an 802.15.4 radio; elsewhere hc_zigbee is a stub.
  espressif/esp-zigbee-lib:
    version: "~1.6.8"
    rules:
      - if: "target in [esp32c6, esp32h2]"
  espressif/esp-zboss-lib:
    version: "~1.6.4"
    rules:
      - if: "target in [esp32c6, esp32h2]"
